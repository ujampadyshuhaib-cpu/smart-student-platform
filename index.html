<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Student Platform | Attendance, Exams & Academic Portals</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Chart.js for Attendance & Exam Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom App CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
          <i class="fas fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <span class="text-xs font-black tracking-wider uppercase text-indigo-600 dark:text-indigo-400">Greenwood Academy</span>
          <h1 class="text-base sm:text-lg font-black tracking-tight leading-none text-slate-900 dark:text-white flex items-center gap-2">
            Smart Student Platform
            <span class="hidden md:inline-block px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">v2.4</span>
          </h1>
        </div>
      </div>

      <!-- Action Items & User Profile -->
      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Theme Toggle -->
        <button onclick="window.app.toggleTheme()" title="Toggle Dark/Light Mode" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center transition-colors">
          <i id="theme-toggle-icon" class="fas fa-moon text-slate-600 dark:text-slate-300 text-sm"></i>
        </button>

        <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>

        <!-- Current User Avatar / Switcher Button -->
        <div id="top-user-profile">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Quick Demo Role Switcher Bar -->
  <div id="demo-role-switcher-container" class="bg-indigo-50/70 dark:bg-indigo-950/30 border-b border-indigo-100 dark:border-indigo-900/50 py-2.5 px-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-xs font-bold text-indigo-950 dark:text-indigo-300">
        <i class="fas fa-bolt text-amber-500 animate-pulse"></i>
        <span>1-Click Role Switcher:</span>
      </div>
      <div id="demo-role-switcher" class="flex flex-wrap items-center gap-2">
        <!-- Dynamically populated buttons for Admin, Teacher, Student, Parent -->
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="module-container" class="fade-in">
      <!-- Dynamically rendered: AdminModule / TeacherModule / StudentModule / ParentModule -->
    </div>
  </main>

  <!-- Global Modal Dialog -->
  <div id="app-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-2xl w-full overflow-hidden transition-all my-8">
      <div id="modal-header" class="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <h3 id="modal-title" class="font-extrabold text-lg text-slate-900 dark:text-white"></h3>
        <button id="modal-close-btn" onclick="window.app.closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-700">
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 max-h-[80vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div id="app-toast" class="fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl bg-indigo-600 text-white shadow-xl shadow-indigo-600/30 transition-all transform duration-300 opacity-0 translate-y-4 pointer-events-none">
    <i id="toast-icon" class="fas fa-info-circle text-lg"></i>
    <span id="toast-message" class="text-xs font-bold"></span>
  </div>

  <!-- Footer -->
  <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-900">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>&copy; 2026 Greenwood International Academy &bull; Smart Student Platform</p>
      <div class="flex items-center gap-4 text-xs font-semibold text-slate-600 dark:text-slate-400">
        <span class="inline-flex items-center gap-1.5"><i class="fas fa-shield-alt text-indigo-500"></i>Role-Based Security</span>
        <span class="inline-flex items-center gap-1.5"><i class="fas fa-bolt text-emerald-500"></i>Realtime Local Persistence</span>
      </div>
    </div>
  </footer>

  <!-- Core Scripts in Dependency Order -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/student.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
